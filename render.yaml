services:
  - type: web
    name: devloop-hackathon
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: devloop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8000"
      - key: STATIC_DIR
        value: /app/frontend-dist
      - key: DATABASE_URL
        value: sqlite:////var/data/devloop.db
      - key: CHECKPOINT_PATH
        value: /var/data/workflow-checkpoints.sqlite
      - key: ALLOW_LOCAL_REPOSITORIES
        value: "false"
      - key: ACCESS_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: openai/gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false